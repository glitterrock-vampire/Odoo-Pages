services:
  # Odoo Web Service (using external PostgreSQL from Layerbase)
  - type: web
    name: cdt-odoo-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/odoo/Dockerfile.web
    envVars:
      - key: HOST
        value: postgresql-1-fine-pool.cloud.layerbase.dev
      - key: PORT
        value: 5432
      - key: USER
        value: odoo_user
      - key: PASSWORD
        value: SecureOdooPass123!
      - key: DB_SSLMODE
        value: require
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false
      - key: CDT_NEWSLETTER_SHARED_SECRET
        sync: false
