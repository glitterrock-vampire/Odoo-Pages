kind = "web"
previewPath = "/"
title = "CDT Jamaica"
version = "1.0.0"
id = "artifacts/cdt-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21299

[services.development]
run = "pnpm --filter @workspace/cdt-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cdt-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/cdt-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21299"
BASE_PATH = "/"
