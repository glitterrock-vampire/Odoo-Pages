openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CDT Jamaica Management API with Odoo Community integration
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard statistics
  - name: students
    description: Student management
  - name: classes
    description: Class management
  - name: contacts
    description: Contacts synced from Odoo
  - name: donations
    description: Donation tracking via Odoo
  - name: finances
    description: Financial data from Odoo
  - name: tuition
    description: Read-only student fee and tuition balances from Odoo
  - name: attendance
    description: Read-only student attendance records and summary from Odoo
  - name: performances
    description: Performance event management
  - name: tasks
    description: Tasks synced from Odoo
  - name: reports
  - name: settings
    description: Reporting and analytics
  - name: content
    description: Read-only website content mirrored from Sanity into Odoo

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get high-level dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Students ───────────────────────────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: classId
          schema:
            type: ["integer", "null"]
        - in: query
          name: status
          schema:
            type: ["string", "null"]
            enum: [active, inactive, null]
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Legacy student creation endpoint; linked records are managed in Odoo
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "409":
          description: Student and enrollment changes must be made in Odoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Legacy student update endpoint; linked records are managed in Odoo
      deprecated: true
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "409":
          description: Student and enrollment changes must be made in Odoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Legacy student deletion endpoint; linked records are managed in Odoo
      deprecated: true
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Student and enrollment changes must be made in Odoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Classes ────────────────────────────────────────────────────────────────
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List all classes
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DanceClass"
    post:
      operationId: createClass
      tags: [classes]
      summary: Legacy class creation endpoint; linked records are managed in Odoo
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DanceClass"
        "409":
          description: Class and enrollment changes must be made in Odoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a class by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DanceClass"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Legacy class update endpoint; linked records are managed in Odoo
      deprecated: true
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassUpdate"
      responses:
        "200":
          description: Updated class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DanceClass"
        "409":
          description: Class and enrollment changes must be made in Odoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Legacy class deletion endpoint; linked records are managed in Odoo
      deprecated: true
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Class and enrollment changes must be made in Odoo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Contacts (Odoo) ─────────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts from Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: ["string", "null"]
            enum: [individual, company, null]
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact in Odoo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact in Odoo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid contact update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attempted to change a public profile field still managed by Sanity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Donations (Odoo) ────────────────────────────────────────────────────
  /donations:
    get:
      operationId: listDonations
      tags: [donations]
      summary: List donations from Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: ["string", "null"]
            enum: [draft, confirmed, paid, cancelled, null]
      responses:
        "200":
          description: List of donations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"
    post:
      operationId: createDonation
      tags: [donations]
      summary: Create a donation in Odoo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationInput"
      responses:
        "201":
          description: Created donation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"

  /donations/{id}:
    get:
      operationId: getDonation
      tags: [donations]
      summary: Get a donation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Donation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Finances (Odoo) ─────────────────────────────────────────────────────
  /finances/invoices:
    get:
      operationId: listInvoices
      tags: [finances]
      summary: List invoices from Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: ["string", "null"]
            enum: [draft, posted, cancelled, null]
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /finances/summary:
    get:
      operationId: getFinancialSummary
      tags: [finances]
      summary: Get financial summary stats from Odoo
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  # ── Tuition and student fees (Odoo) ─────────────────────────────────────
  /tuition/fees:
    get:
      operationId: listTuitionFees
      tags: [tuition]
      summary: List student tuition and fee balances from Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: ["string", "null"]
            enum: [draft, due, partial, paid, cancelled, null]
      responses:
        "200":
          description: Student tuition fee ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TuitionFee"
        "503":
          description: Odoo integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Student attendance (Odoo) ────────────────────────────────────────────
  /attendance:
    get:
      operationId: getAttendance
      tags: [attendance]
      summary: Get student attendance records and summary counts from Odoo
      description: Attendance is read-only here; records are created and updated in Odoo Education.
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: ["string", "null"]
            enum: [present, late, absent, leave, excused, null]
      responses:
        "200":
          description: Student attendance snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSnapshot"
        "503":
          description: Odoo integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Performances ───────────────────────────────────────────────────────────
  /performances:
    get:
      operationId: listPerformances
      tags: [performances]
      summary: List performances
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: upcoming
          schema:
            type: boolean
      responses:
        "200":
          description: List of performances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Performance"
    post:
      operationId: createPerformance
      tags: [performances]
      summary: Create a performance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceInput"
      responses:
        "201":
          description: Created performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"

  /performances/{id}:
    get:
      operationId: getPerformance
      tags: [performances]
      summary: Get a performance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePerformance
      tags: [performances]
      summary: Update a performance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceUpdate"
      responses:
        "200":
          description: Updated performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
        "409":
          description: Sanity-managed performance fields are read-only until cutover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePerformance
      tags: [performances]
      summary: Delete a performance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Sanity-managed performances cannot be deleted until cutover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Tasks (Odoo) ────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks from Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: stage
          schema:
            type: ["string", "null"]
            enum: [todo, in_progress, done, cancelled, null]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task in Odoo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task in Odoo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task in Odoo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Reports ────────────────────────────────────────────────────────────────
  /reports/enrollment:
    get:
      operationId: getEnrollmentReport
      tags: [reports]
      summary: Students enrolled per class
      responses:
        "200":
          description: Enrollment report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentStat"

  /reports/finances:
    get:
      operationId: getFinanceReport
      tags: [reports]
      summary: Monthly revenue breakdown
      parameters:
        - in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: Finance report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyRevenue"

  /school-settings:
    get:
      operationId: getSchoolSettings
      tags: [settings]
      summary: Get Odoo school automation settings
      responses:
        "200":
          description: School settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
    patch:
      operationId: updateSchoolSettings
      tags: [settings]
      summary: Update Odoo school automation settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolSettingsUpdate"
      responses:
        "200":
          description: Updated school settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
        "409":
          description: Outgoing mail must be configured before enabling notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Website content mirror ───────────────────────────────────────────────
  /content/team:
    get:
      operationId: listTeamMembers
      tags: [content]
      summary: List website team members mirrored into Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /content/repertoire:
    get:
      operationId: listRepertoireItems
      tags: [content]
      summary: List repertoire mirrored into Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Repertoire items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepertoireItem"

  /content/media:
    get:
      operationId: listMediaItems
      tags: [content]
      summary: List website media mirrored into Odoo
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Media items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /content/website-settings:
    get:
      operationId: getWebsiteSettings
      tags: [content]
      summary: Get mirrored website settings and sync status
      responses:
        "200":
          description: Website settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteSetting"
        "404":
          description: Website settings not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    DashboardStats:
      type: object
      properties:
        totalStudents:
          type: integer
        activeClasses:
          type: integer
        upcomingPerformances:
          type: integer
        odooConfigured:
          type: boolean
        totalDonations:
          type: ["number", "null"]
        openTasks:
          type: ["integer", "null"]
        monthlyRevenue:
          type: ["number", "null"]
        pendingInvoices:
          type: ["integer", "null"]
        newContactsThisMonth:
          type: ["integer", "null"]
        feesBilled:
          type: ["number", "null"]
        feesCollected:
          type: ["number", "null"]
        feesOutstanding:
          type: ["number", "null"]
        unbilledFees:
          type: ["number", "null"]
        overdueFeesCount:
          type: ["integer", "null"]
        currency:
          type: string
        paymentProviderName:
          type: ["string", "null"]
        paymentProviderState:
          type: ["string", "null"]
        paymentJournalName:
          type: ["string", "null"]
        teamMembers:
          type: ["integer", "null"]
        repertoireItems:
          type: ["integer", "null"]
        totalPerformances:
          type: ["integer", "null"]
        mediaItems:
          type: ["integer", "null"]
        contentLastSyncAt:
          type: ["string", "null"]
        contentSyncStatus:
          type: ["string", "null"]
      required:
        - totalStudents
        - activeClasses
        - upcomingPerformances
        - odooConfigured
        - totalDonations
        - openTasks
        - monthlyRevenue
        - pendingInvoices
        - newContactsThisMonth
        - feesBilled
        - feesCollected
        - feesOutstanding
        - unbilledFees
        - overdueFeesCount
        - currency
        - paymentProviderName
        - paymentProviderState
        - paymentJournalName
        - teamMembers
        - repertoireItems
        - totalPerformances
        - mediaItems
        - contentLastSyncAt
        - contentSyncStatus

    # ── Student ────────────────────────────────────────────────────────────
    Student:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        enrolledClassIds:
          type: array
          items:
            type: integer
        guardianName:
          type: ["string", "null"]
        guardianPhone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        studentNumber:
          type: string
        contactId:
          type: ["integer", "null"]
        contactName:
          type: string
        academicStatus:
          type: string
        classNames:
          type: array
          items:
            type: string
        programName:
          type: ["string", "null"]
        tuitionBilled:
          type: number
        tuitionPaid:
          type: number
        tuitionBalance:
          type: number
        tuitionStatus:
          type: ["string", "null"]
          enum: [draft, due, partial, paid, cancelled, null]
        currency:
          type: string
        sampleData:
          type: boolean
